name: Deploy to GitHub Pages

# One-time setup:
#   1. Settings → Pages → Build and deployment → Source = "GitHub Actions".
#   2. Settings → Secrets and variables → Actions → New repository secret:
#        VITE_SUPABASE_URL        e.g. https://unhwjxccbknojmllmdjx.supabase.co
#        VITE_SUPABASE_ANON_KEY   the public anon key (safe to expose in the bundle)
#      Do NOT add SUPABASE_SERVICE_ROLE_KEY — it is server-only and must never ship.
#
# Builds on every push to master (and on demand), then publishes dist/ to Pages.
# vite.config.js reads GITHUB_PAGES to serve assets from /ein-mehr-beissen-bitte/.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
