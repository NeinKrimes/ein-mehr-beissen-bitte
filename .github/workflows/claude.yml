name: Claude Code

# Lets you @claude on an issue/PR to get a PR back — e.g. an issue body like
# "add a Vietnamese chain off a whole chicken" yields a PR adding the chain to
# src/data/chains.js in the existing shape. The action reads CLAUDE.md for
# repo conventions (chains shape, "run npm run seed to fill new meals", etc.).
#
# Secret required (repo Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY
# Recommended: install the official Claude GitHub App (https://github.com/apps/claude)
# so PR/issue permissions are handled for you.

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
