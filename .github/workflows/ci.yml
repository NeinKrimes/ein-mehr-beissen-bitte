name: CI

# Secrets: none.

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # The unit suite imports the Supabase-backed shopping cart module but
          # never performs network requests. Valid placeholders keep client
          # construction from failing before the tests can run.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-test-placeholder
      - run: npm run build
