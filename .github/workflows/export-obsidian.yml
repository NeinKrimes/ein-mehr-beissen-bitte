name: Export vault

# Secrets required (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY   (or a read-capable anon key)
#
# Commits the regenerated vault mirror using the built-in GITHUB_TOKEN
# (contents: write). If master is a protected branch that blocks the
# github-actions bot, provide a PAT and swap it into the checkout + push.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # nightly 07:00 UTC (after the weekly seed)

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run export:vault
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit vault mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vault/recipes vault/anchors
          if git diff --cached --quiet; then
            echo "No vault changes to commit."
          else
            git commit -m "chore: regenerate Obsidian vault mirror [skip ci]"
            git push
          fi
